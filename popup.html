<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEO Inspector</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header style="position: relative;">
      <button id="popout" class="btn-popout" title="弹出独立窗口">⛶</button>
      <h1>🔍 SEO Inspector</h1>
      <p class="subtitle">页面 SEO 诊断工具</p>
    </header>

    <div id="status" class="status"></div>

    <div class="main-layout">
      <!-- Left Tab Sidebar -->
      <nav class="tabs-sidebar">
        <button class="tab active" data-tab="content">📋 Content</button>
        <button class="tab" data-tab="indexability">🔗 Indexability</button>
        <button class="tab" data-tab="schema">📊 Schema Markup</button>
        <button class="tab" data-tab="links">🔗 Links</button>
        <button class="tab" data-tab="visits">🧭 访问记录</button>
      </nav>

      <!-- Right Content Area -->
      <div class="content-area">
        <!-- Tab: Content -->
        <div id="tab-content" class="tab-panel active">
          <div id="content-fields" class="field-list"></div>
        </div>

        <!-- Tab: Indexability -->
        <div id="tab-indexability" class="tab-panel">
          <div id="indexability-fields" class="field-list"></div>
        </div>

        <!-- Tab: Schema Markup -->
        <div id="tab-schema" class="tab-panel">
          <div id="schema-list" class="schema-list"></div>
        </div>

        <!-- Tab: Links -->
        <div id="tab-links" class="tab-panel">
          <div id="links-start" class="links-start" style="display:none;"></div>
          <div id="links-toolbar" class="links-toolbar" style="display:none;">
            <span id="links-summary" class="links-summary"></span>
            <span class="links-filters">
              <button class="filter-btn active" data-filter="all">全部</button>
              <button class="filter-btn" data-filter="error">仅错误</button>
              <button class="filter-btn" data-filter="redirect">仅重定向</button>
            </span>
          </div>
          <div id="links-list" class="links-list"></div>
        </div>

        <!-- Tab: Browser navigation history -->
        <div id="tab-visits" class="tab-panel">
          <div id="visits-summary" class="visits-summary"></div>
          <div id="visits-list" class="visits-list"></div>
        </div>
      </div>
    </div>

    <footer>
      <button id="refresh" class="btn-refresh">🔄 刷新</button>
      <button id="tab-action" class="btn-action">📋 复制</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
